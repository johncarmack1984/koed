name: Vouch PR

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check PR author trust
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Check PR author
        uses: mitchellh/vouch/action/check-pr@v1
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
          vouched-file: .github/VOUCHED.td
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
