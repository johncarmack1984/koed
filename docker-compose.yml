services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codex_memory}
      POSTGRES_USER: ${POSTGRES_USER:-codex_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codex_memory}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_memory -d codex_memory"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  embedding-service:
    build:
      context: ./apps/embedding-service
    environment:
      MODEL_REPO: ${EMBEDDING_MODEL_REPO:-Qwen/Qwen3-Embedding-0.6B-GGUF}
      MODEL_FILE: ${EMBEDDING_MODEL_FILE:-Qwen3-Embedding-0.6B-Q8_0.gguf}
      MODEL_NAME: ${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B-GGUF}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_BATCH_LIMIT: ${EMBEDDING_BATCH_LIMIT:-16}
      EMBEDDING_MAX_TOKENS: ${EMBEDDING_MAX_TOKENS:-32768}
      RERANKER_ENABLED: "${EMBEDDING_RERANKER_ENABLED:-false}"
      RERANKER_MODEL: ${EMBEDDING_RERANKER_MODEL:-n24q02m/Qwen3-Reranker-0.6B-ONNX}
      RERANKER_BATCH_LIMIT: ${EMBEDDING_RERANKER_BATCH_LIMIT:-100}
      LLAMA_N_CTX: ${EMBEDDING_LLAMA_N_CTX:-32768}
    volumes:
      - embedding-model-cache:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=5)"'
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-3000}
      LOG_LEVEL: ${API_LOG_LEVEL:-info}
      MEMORY_MODE: ${MEMORY_MODE:-codex_subscription}
      DATABASE_URL: postgres://${POSTGRES_USER:-codex_memory}:${POSTGRES_PASSWORD:-codex_memory}@postgres:5432/${POSTGRES_DB:-codex_memory}
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${API_DATA_ENCRYPTION_KEY:?Set API_DATA_ENCRYPTION_KEY in .env}
      API_TOKEN_PEPPER: ${API_TOKEN_PEPPER:?Set API_TOKEN_PEPPER in .env}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B-GGUF}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-local-qwen3-embedding-0.6b-gguf-v1}
      RERANKING_ENABLED: "${MEMORY_RERANKING_ENABLED:-false}"
      MEMORY_VECTOR_CANDIDATE_LIMIT: ${MEMORY_VECTOR_CANDIDATE_LIMIT:-20}
      MEMORY_LCM_LEAF_EVENT_THRESHOLD: ${MEMORY_LCM_LEAF_EVENT_THRESHOLD:-5}
      MEMORY_LCM_LEAF_TOKEN_THRESHOLD: ${MEMORY_LCM_LEAF_TOKEN_THRESHOLD:-6000}
      MEMORY_LCM_FRESH_EVENT_TAIL: ${MEMORY_LCM_FRESH_EVENT_TAIL:-1}
      MEMORY_LCM_DEPTH1_FANOUT: ${MEMORY_LCM_DEPTH1_FANOUT:-2}
      MEMORY_SERVER_SYNTHESIS_UNSAFE_ALLOW: ${MEMORY_SERVER_SYNTHESIS_UNSAFE_ALLOW:-}
      REQUEST_BODY_LIMIT_BYTES: ${API_REQUEST_BODY_LIMIT_BYTES:-262144}
      AUTH_RATE_LIMIT_WINDOW_MS: ${API_AUTH_RATE_LIMIT_WINDOW_MS:-60000}
      AUTH_RATE_LIMIT_MAX: ${API_AUTH_RATE_LIMIT_MAX:-20}
      MEMORY_RATE_LIMIT_WINDOW_MS: ${API_MEMORY_RATE_LIMIT_WINDOW_MS:-60000}
      MEMORY_RATE_LIMIT_MAX: ${API_MEMORY_RATE_LIMIT_MAX:-120}
      COOKIE_SECURE: "${API_COOKIE_SECURE:-false}"
      CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      KOED_HOST_CHECKOUT_PATH: ${API_HOST_CHECKOUT_PATH:-${PWD}}
    command: >
      sh -c "cd packages/db &&
      node node_modules/node-pg-migrate/bin/node-pg-migrate.js up --migrations-dir src/migrations --migrations-table schema_migrations &&
      cd /app &&
      node apps/api/dist/index.js"
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: ${WORKER_NODE_ENV:-production}
      MEMORY_MODE: ${MEMORY_MODE:-codex_subscription}
      DATABASE_URL: postgres://${POSTGRES_USER:-codex_memory}:${POSTGRES_PASSWORD:-codex_memory}@postgres:5432/${POSTGRES_DB:-codex_memory}
      REDIS_URL: redis://redis:6379
      DATA_ENCRYPTION_KEY: ${API_DATA_ENCRYPTION_KEY:?Set API_DATA_ENCRYPTION_KEY in .env}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
      EMBEDDING_MODEL: ${EMBEDDING_MODEL_NAME:-Qwen/Qwen3-Embedding-0.6B-GGUF}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-local-qwen3-embedding-0.6b-gguf-v1}
      RERANKING_ENABLED: "${MEMORY_RERANKING_ENABLED:-false}"
      MEMORY_VECTOR_CANDIDATE_LIMIT: ${MEMORY_VECTOR_CANDIDATE_LIMIT:-20}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        VITE_API_BASE_URL: ${CONSOLE_API_BASE_URL:-http://localhost:${API_HOST_PORT:-3000}}
    environment:
      NODE_ENV: ${CONSOLE_NODE_ENV:-production}
      WEB_PORT: ${CONSOLE_PORT:-5173}
    ports:
      - "${CONSOLE_HOST_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  embedding-model-cache:
